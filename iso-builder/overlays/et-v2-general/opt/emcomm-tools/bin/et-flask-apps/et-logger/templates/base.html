<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ t['title'] }}{% endblock %} - LiaisonOS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/logger.css') }}">
    <!-- Leaflet bundled LOCALLY (was loaded from a CDN, which fails offline:
         no global L, no map at all). This is the real offline-maps fix. -->
    <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}" />
    <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
