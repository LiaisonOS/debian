# Author  : Gaston Gonzalez
# Date    : 31 October 2024
# Updated : 8 November 2024
# Purpose : Dire Wolf template for basic packet operation  

# Audio settings
ADEVICE {{ET_AUDIO_DEVICE}}
CHANNEL 0

# User settings
MYCALL {{ET_CALLSIGN}}

# Modem settings
MODEM 1200

# PTT timing tuned for HT-class radios (Kenwood D-75 etc.) whose SP/MIC
# PTT circuit + audio-DSP settling is slower than a proper data-jack
# mobile rig. TXDELAY 40 = 400 ms preamble; TXTAIL 20 = 200 ms drop-out;
# DWAIT 30 = 300 ms hold-off after seeing carrier (cuts collisions on
# busy freqs). Safe on mobile rigs too — costs ~100 ms per transmit.
TXDELAY 40
TXTAIL  20
DWAIT   30

# Rig control settings. Do not change this.
# LiaisonOS uses Hamlib's rig control daemon for all radio interfaces.
PTT RIG 2 localhost:4532

# Enable ports to allow other applications use Dire Wolf as the packet engine
AGWPORT 8000
KISSPORT 8001
